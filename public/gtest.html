<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circuit Graph</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060810;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  .wrap {
    position: relative;
    z-index: 0;
    width: 620px;
    height: 600px;
    opacity: 0.5;
    transition: opacity 0.8s ease;
  }
  @media (min-width: 768px) { .wrap { width: 720px; height: 540px; opacity: 0.75; } }
  @media (min-width: 1024px) { .wrap { width: 860px; height: 640px; opacity: 1; } }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    border-radius: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" aria-hidden="true"></canvas>
</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = 860;
  const H = 640;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  /* --- Palette --- */
  const ACCENT  = "#4F7EFF";
  const WARM    = "#FF6B35";
  const TEAL    = "#2DD4A8";
  const DIM     = "#2A3258";
  const BG      = "#060810";
  const SURF    = "#0C0F18";
  const BORDER  = "#181D2E";
  const MUTED   = "#6B7799";
  const GRID    = "rgba(30,38,65,0.35)";

  /* --- Nodes --- */
  const nodes = [
    { id: "ingress",   x: 100, y: 100,  r: 10, label: "INGRESS",   warm: false, gateway: true,  status: "healthy" },
    { id: "auth",      x: 250, y: 82,   r: 7,  label: "AUTH",      warm: false, gateway: false, status: "healthy" },
    { id: "api",       x: 390, y: 96,   r: 11, label: "API",       warm: true,  gateway: true,  status: "warning" },
    { id: "queue",     x: 540, y: 84,   r: 7,  label: "QUEUE",     warm: false, gateway: false, status: "healthy" },
    { id: "booking",   x: 160, y: 224,  r: 7,  label: "BOOKING",   warm: false, gateway: false, status: "healthy" },
    { id: "matching",  x: 310, y: 234,  r: 7,  label: "MATCHING",  warm: false, gateway: false, status: "healthy" },
    { id: "dispatch",  x: 450, y: 224,  r: 7,  label: "DISPATCH",  warm: false, gateway: false, status: "healthy" },
    { id: "notify",    x: 600, y: 236,  r: 7,  label: "NOTIFY",    warm: false, gateway: false, status: "degraded" },
    { id: "media",     x: 110, y: 350,  r: 7,  label: "MEDIA",     warm: false, gateway: false, status: "healthy" },
    { id: "billing",   x: 240, y: 366,  r: 7,  label: "BILLING",   warm: false, gateway: false, status: "healthy" },
    { id: "cms",       x: 388, y: 348,  r: 7,  label: "CMS",       warm: false, gateway: false, status: "healthy" },
    { id: "reporting", x: 540, y: 360,  r: 7,  label: "REPORT",    warm: false, gateway: false, status: "healthy" },
    { id: "storage",   x: 168, y: 486,  r: 7,  label: "STORAGE",   warm: false, gateway: false, status: "healthy" },
    { id: "cache",     x: 374, y: 486,  r: 7,  label: "CACHE",     warm: false, gateway: false, status: "healthy" },
    { id: "egress",    x: 580, y: 486,  r: 10, label: "EGRESS",    warm: false, gateway: true,  status: "healthy" },
  ];

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  /* --- Edges --- */
  const edges = [
    { a: "ingress",  b: "auth",      active: true  },
    { a: "auth",     b: "api",       active: true  },
    { a: "api",      b: "queue",     active: false },
    { a: "ingress",  b: "booking",   active: false },
    { a: "auth",     b: "matching",  active: true  },
    { a: "api",      b: "dispatch",  active: true  },
    { a: "queue",    b: "notify",    active: true  },
    { a: "booking",  b: "billing",   active: true  },
    { a: "matching", b: "cms",       active: false },
    { a: "dispatch", b: "reporting", active: true  },
    { a: "notify",   b: "reporting", active: false },
    { a: "media",    b: "booking",   active: false },
    { a: "media",    b: "storage",   active: true  },
    { a: "billing",  b: "cache",     active: false },
    { a: "cms",      b: "cache",     active: true  },
    { a: "reporting",b: "egress",    active: true  },
    { a: "cache",    b: "egress",    active: false },
  ];

  /* --- Computed edge data --- */
  function computeEdge(e) {
    const a = nodeMap[e.a], b = nodeMap[e.b];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    const perp = 0.2;
    const cx = mx - dy * perp, cy = my + dx * perp;
    /* Precompute bezier samples for faster hit-testing */
    const samples = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, mt = 1 - t;
      samples.push({
        x: mt*mt*a.x + 2*mt*t*cx + t*t*b.x,
        y: mt*mt*a.y + 2*mt*t*cy + t*t*b.y,
      });
    }
    return { ...e, a, b, cx, cy, samples, len };
  }

  const computedEdges = edges.map(computeEdge);

  /* --- Animated dots on active edges --- */
  const dots = computedEdges.filter(e => e.active).map((e, i) => ({
    edge: e,
    t: (i * 0.17) % 1,
    speed: 0.0022 + (i % 5) * 0.0005,
    trail: [],
  }));

  /* --- Pulse rings --- */
  const pulses = nodes.map((n, i) => ({
    node: n,
    t: (i * 0.15) % 1,
    speed: 0.0035 + (i % 4) * 0.0008,
  }));

  /* --- Ambient particles --- */
  const particles = Array.from({ length: 50 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.15,
    vy: (Math.random() - 0.5) * 0.12,
    size: Math.random() * 1.2 + 0.3,
    alpha: Math.random() * 0.15 + 0.03,
  }));

  /* --- Mouse state with lerped hover --- */
  let mouse = { x: -999, y: -999 };
  let hoveredNode = null;
  let hoverAlpha = 0; // smooth transition

  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouse = {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height),
    };
  });
  canvas.addEventListener("mouseleave", () => {
    mouse = { x: -999, y: -999 };
  });

  /* --- Utilities --- */
  function dist(ax, ay, bx, by) {
    return Math.sqrt((ax - bx) ** 2 + (ay - by) ** 2);
  }
  function hexA(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function bezPt(ax,ay,bx,by,cx,cy,t) {
    const m = 1 - t;
    return { x: m*m*ax + 2*m*t*cx + t*t*bx, y: m*m*ay + 2*m*t*cy + t*t*by };
  }
  function roundRect(cx, x, y, w, h, r) {
    cx.beginPath();
    cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
    cx.quadraticCurveTo(x+w,y,x+w,y+r); cx.lineTo(x+w,y+h-r);
    cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); cx.lineTo(x+r,y+h);
    cx.quadraticCurveTo(x,y+h,x,y+h-r); cx.lineTo(x,y+r);
    cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
  }

  function getHovered() {
    let closest = null, minD = 36;
    for (const n of nodes) {
      const d = dist(mouse.x, mouse.y, n.x, n.y);
      if (d < minD) { minD = d; closest = n; }
    }
    return closest;
  }

  /* --- Draw arrow head at end of bezier --- */
  function drawArrow(e, alpha, color) {
    const { a, b, cx, cy } = e;
    const t1 = 0.92, t2 = 1.0;
    const p1 = bezPt(a.x,a.y,b.x,b.y,cx,cy,t1);
    const p2 = bezPt(a.x,a.y,b.x,b.y,cx,cy,t2);
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const sz = 5;
    ctx.save();
    ctx.translate(p2.x, p2.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-sz, -sz * 0.5);
    ctx.lineTo(-sz, sz * 0.5);
    ctx.closePath();
    ctx.fillStyle = hexA(color, alpha * 0.7);
    ctx.fill();
    ctx.restore();
  }

  /* --- Draw hexagon for gateway nodes --- */
  function hexPath(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 6;
      const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  /* --- Main render loop --- */
  function draw() {
    ctx.clearRect(0, 0, W, H);

    /* Smooth hover transition */
    const target = getHovered();
    hoveredNode = target;
    hoverAlpha += ((target ? 1 : 0) - hoverAlpha) * 0.12;

    const hIds = new Set();
    if (hoveredNode) {
      hIds.add(hoveredNode.id);
      computedEdges.forEach(e => {
        if (e.a.id === hoveredNode.id || e.b.id === hoveredNode.id) {
          hIds.add(e.a.id);
          hIds.add(e.b.id);
        }
      });
    }
    const ha = hoverAlpha;
    const mx = mouse.x, my = mouse.y;
    const hasM = mx > 0;

    /* ---- Background ---- */
    /* Radial vignette */
    const vg = ctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, W * 0.7);
    vg.addColorStop(0, "rgba(14,20,40,0.0)");
    vg.addColorStop(1, "rgba(4,5,10,0.6)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    /* Dot grid */
    const gs = 32;
    ctx.fillStyle = GRID;
    for (let gx = gs; gx < W; gx += gs) {
      for (let gy = gs; gy < H; gy += gs) {
        const dm = dist(gx, gy, mx, my);
        const ga = hasM ? Math.max(0.08, 0.35 - dm / 600) : 0.35;
        ctx.globalAlpha = ga;
        ctx.beginPath();
        ctx.arc(gx, gy, 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    /* ---- Ambient particles ---- */
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = hexA(ACCENT, p.alpha);
      ctx.fill();
    });

    /* ---- Mouse proximity lines ---- */
    if (hasM) {
      const sorted = [...nodes]
        .sort((a, b) => dist(mx,my,a.x,a.y) - dist(mx,my,b.x,b.y))
        .slice(0, 5);
      sorted.forEach(n => {
        const d = dist(mx, my, n.x, n.y);
        if (d > 200) return;
        const a = (1 - d / 200) * 0.22 * (1 - ha * 0.5);
        const grad = ctx.createLinearGradient(mx, my, n.x, n.y);
        grad.addColorStop(0, hexA(n.warm ? WARM : ACCENT, a));
        grad.addColorStop(1, hexA(n.warm ? WARM : ACCENT, 0));
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(n.x, n.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 0.6;
        ctx.setLineDash([2, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }

    /* ---- Edges ---- */
    computedEdges.forEach(e => {
      const isFocused = hoveredNode && (e.a.id === hoveredNode.id || e.b.id === hoveredNode.id);
      const isRelated = hIds.has(e.a.id) || hIds.has(e.b.id);

      let alpha, width, color;
      if (ha < 0.05) {
        alpha = e.active ? 0.3 : 0.1;
        width = e.active ? 1.2 : 0.5;
        color = e.active ? ACCENT : DIM;
      } else if (isFocused) {
        alpha = lerp(0.3, 0.9, ha);
        width = lerp(1.2, 2.0, ha) * (e.active ? 1 : 0.6);
        color = e.active ? ACCENT : "#7788BB";
      } else if (isRelated) {
        alpha = lerp(0.3, 0.4, ha);
        width = lerp(1.2, 1.0, ha) * (e.active ? 1 : 0.5);
        color = e.active ? ACCENT : DIM;
      } else {
        alpha = lerp(0.3, 0.04, ha);
        width = lerp(1.2, 0.4, ha);
        color = DIM;
      }

      /* Edge glow for focused active edges */
      if (isFocused && e.active && ha > 0.3) {
        ctx.beginPath();
        ctx.moveTo(e.a.x, e.a.y);
        ctx.quadraticCurveTo(e.cx, e.cy, e.b.x, e.b.y);
        ctx.strokeStyle = hexA(color, alpha * 0.25 * ha);
        ctx.lineWidth = width + 6;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.quadraticCurveTo(e.cx, e.cy, e.b.x, e.b.y);
      ctx.strokeStyle = hexA(color, alpha);
      ctx.lineWidth = width;
      ctx.stroke();

      /* Arrow */
      if (e.active && alpha > 0.15) {
        drawArrow(e, alpha, color);
      }
    });

    /* ---- Traveling dots with trails ---- */
    dots.forEach(d => {
      const e = d.edge;
      const pt = bezPt(e.a.x, e.a.y, e.b.x, e.b.y, e.cx, e.cy, d.t);

      /* Update trail */
      d.trail.push({ x: pt.x, y: pt.y });
      if (d.trail.length > 8) d.trail.shift();

      const isFocused = hoveredNode && (e.a.id === hoveredNode.id || e.b.id === hoveredNode.id);
      const baseAlpha = ha < 0.05 ? 0.85 : isFocused ? lerp(0.85, 1, ha) : lerp(0.85, 0.06, ha);

      /* Draw trail */
      if (baseAlpha > 0.1) {
        d.trail.forEach((tp, i) => {
          const ta = (i / d.trail.length) * baseAlpha * 0.3;
          const tr = (i / d.trail.length) * 1.6;
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, Math.max(0.1, tr), 0, Math.PI * 2);
          ctx.fillStyle = hexA(ACCENT, ta);
          ctx.fill();
        });

        /* Main dot */
        const dotR = isFocused ? lerp(1.8, 3, ha) : 1.8;
        /* Glow */
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, dotR + 4, 0, Math.PI * 2);
        ctx.fillStyle = hexA(ACCENT, baseAlpha * 0.15);
        ctx.fill();
        /* Core */
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, dotR, 0, Math.PI * 2);
        ctx.fillStyle = hexA(ACCENT, baseAlpha);
        ctx.fill();
      }

      d.t = (d.t + d.speed) % 1;
    });

    /* ---- Pulse rings ---- */
    pulses.forEach(p => {
      const n = p.node;
      const isH = hIds.has(n.id);
      const show = ha < 0.05 || isH;
      if (!show) { p.t = (p.t + p.speed) % 1; return; }

      const maxR = n.gateway ? 26 : 18;
      const baseC = n.status === "degraded" ? "#FF4466"
                   : n.warm ? WARM : ACCENT;
      const ringR = p.t * maxR;
      const alpha = (1 - p.t) * (n.gateway ? 0.45 : 0.3);
      const vis = ha < 0.05 ? 1 : lerp(0.2, 1, ha);

      /* Outer ring */
      ctx.beginPath();
      ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = hexA(baseC, alpha * vis);
      ctx.lineWidth = 0.6;
      ctx.stroke();

      /* Inner ring for gateways */
      if (n.gateway) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, ringR * 0.6, 0, Math.PI * 2);
        ctx.strokeStyle = hexA(baseC, alpha * vis * 0.5);
        ctx.lineWidth = 0.4;
        ctx.stroke();
      }

      p.t = (p.t + p.speed) % 1;
    });

    /* ---- Nodes ---- */
    nodes.forEach(n => {
      const isH = hIds.has(n.id);
      const isCentral = hoveredNode && hoveredNode.id === n.id;
      const baseC = n.status === "degraded" ? "#FF4466"
                   : n.warm ? WARM : ACCENT;

      /* Smooth scale */
      const scaleT = isCentral ? lerp(1, 1.3, ha) : isH ? lerp(1, 1.1, ha) : lerp(1, 0.85, ha);
      const r = n.r * scaleT;

      /* Visibility alpha */
      const vis = ha < 0.05 ? 1 : isH ? lerp(0.5, 1, ha) : lerp(1, 0.15, ha);

      /* Outer halo for central */
      if (isCentral && ha > 0.2) {
        const haloR = r + 18 * ha;
        const haloGrad = ctx.createRadialGradient(n.x, n.y, r, n.x, n.y, haloR);
        haloGrad.addColorStop(0, hexA(baseC, 0.12 * ha));
        haloGrad.addColorStop(1, hexA(baseC, 0));
        ctx.beginPath();
        ctx.arc(n.x, n.y, haloR, 0, Math.PI * 2);
        ctx.fillStyle = haloGrad;
        ctx.fill();
      }

      if (n.gateway) {
        /* Hexagonal gateway node */
        /* Background hex */
        hexPath(n.x, n.y, r + 4.5);
        ctx.fillStyle = hexA(BG, vis);
        ctx.strokeStyle = hexA(BORDER, vis * 0.8);
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();

        /* Inner hex */
        hexPath(n.x, n.y, r);
        ctx.fillStyle = hexA(SURF, vis);
        ctx.strokeStyle = hexA(baseC, vis * (isCentral ? 1 : 0.8));
        ctx.lineWidth = isCentral ? 2 : 1.3;
        ctx.fill();
        ctx.stroke();

        /* Center diamond */
        const dr = r * 0.32;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y - dr);
        ctx.lineTo(n.x + dr, n.y);
        ctx.lineTo(n.x, n.y + dr);
        ctx.lineTo(n.x - dr, n.y);
        ctx.closePath();
        ctx.fillStyle = hexA(baseC, vis * 0.9);
        ctx.fill();
      } else {
        /* Circular service node */
        /* Outer ring */
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3.5, 0, Math.PI * 2);
        ctx.fillStyle = hexA(BG, vis);
        ctx.strokeStyle = hexA(BORDER, vis * 0.8);
        ctx.lineWidth = 0.8;
        ctx.fill();
        ctx.stroke();

        /* Inner circle */
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = hexA(SURF, vis);
        ctx.strokeStyle = hexA(baseC, vis * (isCentral ? 1 : 0.7));
        ctx.lineWidth = isCentral ? 1.8 : 1.1;
        ctx.fill();
        ctx.stroke();

        /* Center dot */
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = hexA(baseC, vis * 0.85);
        ctx.fill();
      }

      /* Status indicator */
      if (n.status === "degraded" && vis > 0.3) {
        const sx = n.x + r * 0.7, sy = n.y - r * 0.7;
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = hexA("#FF4466", vis);
        ctx.fill();
      }

      /* Label */
      ctx.font = `500 ${n.gateway ? 9.5 : 8.5}px "JetBrains Mono", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillStyle = hexA(isCentral ? baseC : MUTED, vis * (isCentral ? 1 : 0.75));
      ctx.fillText(n.label, n.x, n.y + r + 8);
    });

    /* ---- Tooltip ---- */
    if (hoveredNode && ha > 0.3) {
      const n = hoveredNode;
      const baseC = n.warm ? WARM : ACCENT;
      const fullLabels = {
        ingress:"Ingress Gateway", auth:"Auth Service", api:"API Gateway",
        queue:"Message Queue", booking:"Booking Engine", matching:"Match Engine",
        dispatch:"Dispatch Layer", notify:"Notification Hub", media:"Media Service",
        billing:"Billing Service", cms:"Content CMS", reporting:"Reporting Service",
        storage:"Object Storage", cache:"Redis Cache", egress:"Egress Gateway",
      };
      const label = fullLabels[n.id] || n.label;
      const conns = computedEdges.filter(e => e.a.id === n.id || e.b.id === n.id).length;
      const activeConns = computedEdges.filter(e => (e.a.id === n.id || e.b.id === n.id) && e.active).length;
      const statusText = n.status === "healthy" ? "Healthy" : n.status === "warning" ? "Warning" : "Degraded";
      const statusColor = n.status === "healthy" ? TEAL : n.status === "warning" ? WARM : "#FF4466";

      const tw = 220, th = 62;
      let tx = n.x - tw / 2;
      let ty = n.y - n.r * 1.3 - th - 12;
      if (ty < 8) ty = n.y + n.r * 1.3 + 12;
      tx = Math.min(Math.max(tx, 8), W - tw - 8);

      const ta = Math.min(ha * 1.5, 1);

      ctx.save();
      ctx.globalAlpha = ta;

      /* Shadow */
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 4;

      roundRect(ctx, tx, ty, tw, th, 8);
      ctx.fillStyle = "rgba(10,13,22,0.96)";
      ctx.fill();
      ctx.shadowColor = "transparent";

      roundRect(ctx, tx, ty, tw, th, 8);
      ctx.strokeStyle = hexA(baseC, 0.25);
      ctx.lineWidth = 0.8;
      ctx.stroke();

      /* Top accent line */
      ctx.beginPath();
      ctx.moveTo(tx + 8, ty);
      ctx.lineTo(tx + tw - 8, ty);
      ctx.strokeStyle = hexA(baseC, 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();

      /* Title */
      ctx.font = '600 11.5px "JetBrains Mono", monospace';
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = baseC;
      ctx.fillText(label, tx + 12, ty + 10);

      /* Status pill */
      const stw = ctx.measureText(statusText).width + 12;
      const stx = tx + tw - stw - 12;
      roundRect(ctx, stx, ty + 9, stw, 16, 4);
      ctx.fillStyle = hexA(statusColor, 0.12);
      ctx.fill();
      ctx.font = '500 8.5px "JetBrains Mono", monospace';
      ctx.textAlign = "center";
      ctx.fillStyle = statusColor;
      ctx.fillText(statusText, stx + stw / 2, ty + 12.5);

      /* Connections */
      ctx.font = '400 10px "JetBrains Mono", monospace';
      ctx.textAlign = "left";
      ctx.fillStyle = hexA(MUTED, 0.8);
      ctx.fillText(`${activeConns} active / ${conns} total connections`, tx + 12, ty + 34);

      /* Type badge */
      ctx.font = '400 9px "JetBrains Mono", monospace';
      ctx.fillStyle = hexA(MUTED, 0.45);
      ctx.fillText(n.gateway ? "GATEWAY" : "SERVICE", tx + 12, ty + 48);

      ctx.restore();
    }

    /* ---- Legend ---- */
    const lx = 16, ly = H - 78;
    const la = ha < 0.05 ? 0.6 : lerp(0.6, 0.2, ha);

    ctx.save();
    ctx.globalAlpha = la;
    roundRect(ctx, lx, ly, 135, 62, 6);
    ctx.fillStyle = "rgba(10,13,22,0.7)";
    ctx.fill();

    ctx.font = '500 8px "JetBrains Mono", monospace';
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    /* Gateway */
    hexPath(lx + 14, ly + 14, 5);
    ctx.strokeStyle = hexA(ACCENT, 0.8);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = hexA(MUTED, 0.7);
    ctx.fillText("Gateway", lx + 26, ly + 14);

    /* Service */
    ctx.beginPath();
    ctx.arc(lx + 14, ly + 32, 4, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(ACCENT, 0.8);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = hexA(MUTED, 0.7);
    ctx.fillText("Service", lx + 26, ly + 32);

    /* Active edge */
    ctx.beginPath();
    ctx.moveTo(lx + 7, ly + 50);
    ctx.lineTo(lx + 21, ly + 50);
    ctx.strokeStyle = hexA(ACCENT, 0.7);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = hexA(MUTED, 0.7);
    ctx.fillText("Active", lx + 26, ly + 50);

    /* Inactive edge */
    ctx.beginPath();
    ctx.moveTo(lx + 75, ly + 50);
    ctx.lineTo(lx + 89, ly + 50);
    ctx.strokeStyle = hexA(DIM, 0.7);
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.fillStyle = hexA(MUTED, 0.7);
    ctx.fillText("Idle", lx + 94, ly + 50);

    ctx.restore();

    /* ---- Cursor dot ---- */
    if (hasM) {
      ctx.beginPath();
      ctx.arc(mx, my, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = hexA(ACCENT, 0.4);
      ctx.fill();
      /* Crosshair lines */
      const cs = 8;
      ctx.strokeStyle = hexA(ACCENT, 0.12);
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(mx - cs, my); ctx.lineTo(mx - 3, my); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx + 3, my); ctx.lineTo(mx + cs, my); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx, my - cs); ctx.lineTo(mx, my - 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx, my + 3); ctx.lineTo(mx, my + cs); ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
